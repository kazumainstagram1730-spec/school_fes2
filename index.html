<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Festival Slot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- =========================
             タイトル
        ========================== -->
        <h1>🎰 Loss Vegas</h1>


        <!-- =========================
             スロット ＋ 右側コントロール
        ========================== -->
        <section class="slotArea">

            <!-- スロット本体 -->
            <div class="slotMachine">

                <div class="reels">

                    <!-- 1列目 -->
                    <div class="reelColumn">
                        <div class="reel" id="reel1-1">🍒</div>
                        <div class="reel" id="reel1-2">🍋</div>
                        <div class="reel" id="reel1-3">🔔</div>
                    </div>

                    <!-- 2列目 -->
                    <div class="reelColumn">
                        <div class="reel" id="reel2-1">🍋</div>
                        <div class="reel" id="reel2-2">⭐</div>
                        <div class="reel" id="reel2-3">🍒</div>
                    </div>

                    <!-- 3列目 -->
                    <div class="reelColumn">
                        <div class="reel" id="reel3-1">🔔</div>
                        <div class="reel" id="reel3-2">🍒</div>
                        <div class="reel" id="reel3-3">⭐</div>
                    </div>

                    <!-- 4列目 -->
                    <div class="reelColumn">
                        <div class="reel" id="reel4-1">⭐</div>
                        <div class="reel" id="reel4-2">🍋</div>
                        <div class="reel" id="reel4-3">🔔</div>
                    </div>

                    <!-- 5列目 -->
                    <div class="reelColumn">
                        <div class="reel" id="reel5-1">7️⃣</div>
                        <div class="reel" id="reel5-2">🍒</div>
                        <div class="reel" id="reel5-3">🍋</div>
                    </div>

                </div>


                <!-- 当たりライン表示 -->
                <svg
                    id="paylineLayer"
                    class="paylineLayer">
                </svg>

            </div>


            <!-- =========================
                 右側コントロール
            ========================== -->
            <div class="sideControl">


                <!-- COINS -->
                <div class="sideCoins">

                    <span>COINS</span>

                    <!-- JSが使うCOINS -->
                    <strong id="coins">50</strong>

                </div>


                <!-- BET -->
                <section class="betControls">

                    <button
                        id="betMinus"
                        type="button">
                        −
                    </button>


                    <div>

                        BET

                        <!-- 画面に表示するBET -->
                        <strong id="betControlValue">
                            3
                        </strong>

                        <!--
                            JS用のBET
                            画面には表示しない
                        -->
                        <span
                            id="bet"
                            style="display: none;">
                            3
                        </span>

                    </div>


                    <button
                        id="betPlus"
                        type="button">
                        ＋
                    </button>

                </section>


                <!-- SPIN -->
                <button
                    id="spinButton"
                    type="button">
                    ▶ SPIN
                </button>

            </div>

        </section>


        <!-- =========================
             結果表示
        ========================== -->
        <div
            id="result"
            class="result">
            SPINしてみよう！
        </div>


        <!-- =========================
             PAY TABLE
        ========================== -->
        <section class="payout">

            <h2>PAY TABLE</h2>

            <p>🍒 ×3 → BET ×3</p>

            <p>🍋 ×3 → BET ×5</p>

            <p>🔔 ×3 → BET ×8</p>

            <p>⭐ ×3 → BET ×15</p>

            <p>7️⃣ ×3 → BET ×30</p>

            <small>
                4連続 = 2倍　/　5連続 = 4倍
            </small>

        </section>

    </main>


    <!-- =========================
         JavaScript
    ========================== -->
    <script src="script.js"></script>

</body>

</html>
