<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Festival Slot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- =========================
             タイトル
        ========================== -->

        <h1>🎰 FESTIVAL SLOT</h1>


        <!-- =========================
             コイン・BET
        ========================== -->

        <section class="info">

            <div class="infoBox">
                <span>COINS</span>
                <strong id="coins">50</strong>
            </div>

            <div class="infoBox">
                <span>BET</span>
                <strong id="bet">3</strong>
            </div>

        </section>


        <!-- =========================
             スロット
        ========================== -->

        <section class="slotMachine">

            <div class="reels">

                <!-- 1列目 -->
                <div class="reelColumn">
                    <div class="reel" id="reel1-1">🍒</div>
                    <div class="reel" id="reel1-2">🍋</div>
                    <div class="reel" id="reel1-3">🔔</div>
                </div>

                <!-- 2列目 -->
                <div class="reelColumn">
                    <div class="reel" id="reel2-1">🍋</div>
                    <div class="reel" id="reel2-2">⭐</div>
                    <div class="reel" id="reel2-3">🍒</div>
                </div>

                <!-- 3列目 -->
                <div class="reelColumn">
                    <div class="reel" id="reel3-1">🔔</div>
                    <div class="reel" id="reel3-2">🍒</div>
                    <div class="reel" id="reel3-3">⭐</div>
                </div>

                <!-- 4列目 -->
                <div class="reelColumn">
                    <div class="reel" id="reel4-1">⭐</div>
                    <div class="reel" id="reel4-2">🍋</div>
                    <div class="reel" id="reel4-3">🔔</div>
                </div>

                <!-- 5列目 -->
                <div class="reelColumn">
                    <div class="reel" id="reel5-1">7️⃣</div>
                    <div class="reel" id="reel5-2">🍒</div>
                    <div class="reel" id="reel5-3">🍋</div>
                </div>

            </div>


            <!--
                当たりラインをここに描画
            -->
            <svg
                id="paylineLayer"
                class="paylineLayer">
            </svg>

        </section>


        <!-- =========================
             結果
        ========================== -->

        <div id="result" class="result">
            SPINしてみよう！
        </div>


        <!-- =========================
             BET操作
        ========================== -->

        <section class="betControls">

            <button id="betMinus">−</button>

            <div>
                BET
                <strong id="betControlValue">3</strong>
            </div>

            <button id="betPlus">＋</button>

        </section>


        <!-- =========================
             SPIN
        ========================== -->

        <button id="spinButton">
            SPIN
        </button>


        <!-- =========================
             配当表
        ========================== -->

        <section class="payout">

            <h2>PAY TABLE</h2>

            <p>🍒 ×3 → BET ×3</p>
            <p>🍋 ×3 → BET ×5</p>
            <p>🔔 ×3 → BET ×8</p>
            <p>⭐ ×3 → BET ×15</p>
            <p>7️⃣ ×3 → BET ×30</p>

            <small>
                4連続 = 2倍　/　5連続 = 4倍
            </small>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
